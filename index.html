    <script>
      (function() {
        const isROError = function(e) {
          const msg = (typeof e === 'string' ? e : (e && (e.message || e.reason?.message || ''))) || '';
          return msg.indexOf('ResizeObserver loop') !== -1 || msg.indexOf('undelivered notifications') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (isROError(e && (e.error || e.message))) {
            e.stopImmediatePropagation();
            e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isROError(e && (e.reason || e.message))) {
            e.stopImmediatePropagation();
            e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
        const origOnError = window.onerror;
        window.onerror = function(msg) {
          if (isROError(msg)) return true;
          if (origOnError) return origOnError.apply(this, arguments);
        };
      })();
    </script>
