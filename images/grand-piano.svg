<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#18130f" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c1a0e" />
      <stop offset="35%" stop-color="#4a2a17" />
      <stop offset="70%" stop-color="#1f1107" />
      <stop offset="100%" stop-color="#3b1f10" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#f5d061" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="keyShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.65)" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(245, 208, 97, 0.25)" />
      <stop offset="60%" stop-color="rgba(245, 208, 97, 0.05)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <!-- Background base -->
  <rect width="700" height="200" fill="url(#bgGrad)" />
  
  <!-- Subtle wood rim on top edge -->
  <rect x="0" y="0" width="700" height="12" fill="url(#woodGrad)" opacity="0.8" />
  <rect x="0" y="11" width="700" height="1.5" fill="url(#goldAcc)" opacity="0.6" />

  <!-- Concert hall glow -->
  <rect x="0" y="0" width="700" height="200" fill="url(#lampGlow)" />

  <!-- Grand Piano Lid Contour Curves -->
  <path d="M 380,20 Q 520,30 620,90 T 700,170 L 700,200 L 320,200 Z" fill="#0d0d12" opacity="0.75" />
  <path d="M 400,22 Q 535,32 630,92 T 700,172" stroke="url(#goldAcc)" stroke-width="1.5" fill="none" opacity="0.4" />
  
  <!-- Piano Strings / Harp Graphic -->
  <g opacity="0.18" stroke="#d4af37" stroke-width="1">
    <line x1="420" y1="40" x2="680" y2="190" />
    <line x1="440" y1="40" x2="685" y2="185" />
    <line x1="460" y1="40" x2="690" y2="180" />
    <line x1="480" y1="42" x2="695" y2="175" />
    <line x1="500" y1="45" x2="700" y2="170" />
    <line x1="520" y1="50" x2="700" y2="160" />
    <line x1="540" y1="55" x2="700" y2="150" />
    <line x1="560" y1="62" x2="700" y2="140" />
    <line x1="580" y1="70" x2="700" y2="130" />
  </g>

  <!-- Piano Keyboard Section on Left/Center bottom -->
  <g transform="translate(40, 105)">
    <!-- Fallboard shadow -->
    <rect x="-10" y="-8" width="360" height="8" fill="#050507" />
    <line x1="-10" y1="0" x2="350" y2="0" stroke="url(#goldAcc)" stroke-width="2" opacity="0.7" />
    
    <!-- White keys -->
    <g fill="#f4f1ea" stroke="#1c1c1f" stroke-width="1">
      <rect x="0" y="0" width="22" height="90" rx="2" />
      <rect x="22" y="0" width="22" height="90" rx="2" />
      <rect x="44" y="0" width="22" height="90" rx="2" />
      <rect x="66" y="0" width="22" height="90" rx="2" />
      <rect x="88" y="0" width="22" height="90" rx="2" />
      <rect x="110" y="0" width="22" height="90" rx="2" />
      <rect x="132" y="0" width="22" height="90" rx="2" />
      <rect x="154" y="0" width="22" height="90" rx="2" />
      <rect x="176" y="0" width="22" height="90" rx="2" />
      <rect x="198" y="0" width="22" height="90" rx="2" />
      <rect x="220" y="0" width="22" height="90" rx="2" />
      <rect x="242" y="0" width="22" height="90" rx="2" />
      <rect x="264" y="0" width="22" height="90" rx="2" />
      <rect x="286" y="0" width="22" height="90" rx="2" />
      <rect x="308" y="0" width="22" height="90" rx="2" />
    </g>
    <!-- Keys shadow overlay -->
    <rect x="0" y="0" width="330" height="90" fill="url(#keyShadow)" pointer-events="none" />

    <!-- Black keys -->
    <g fill="#121215" stroke="#000" stroke-width="1">
      <rect x="15" y="0" width="14" height="56" rx="1.5" />
      <rect x="37" y="0" width="14" height="56" rx="1.5" />
      <rect x="81" y="0" width="14" height="56" rx="1.5" />
      <rect x="103" y="0" width="14" height="56" rx="1.5" />
      <rect x="125" y="0" width="14" height="56" rx="1.5" />
      <rect x="169" y="0" width="14" height="56" rx="1.5" />
      <rect x="191" y="0" width="14" height="56" rx="1.5" />
      <rect x="235" y="0" width="14" height="56" rx="1.5" />
      <rect x="257" y="0" width="14" height="56" rx="1.5" />
      <rect x="279" y="0" width="14" height="56" rx="1.5" />
    </g>
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#f5d061">GRAND CONCERT D-274</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Acoustic Grand Piano</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Berlin Concert Acoustics • Multi-Velocity Layered</text>
  </g>

  <!-- High-end badge on right -->
  <g transform="translate(610, 40)" opacity="0.85">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(245, 208, 97, 0.12)" stroke="url(#goldAcc)" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#f5d061">24-BIT</text>
  </g>
</svg>
