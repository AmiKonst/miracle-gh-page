<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="strBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100508" />
      <stop offset="50%" stop-color="#240c14" />
      <stop offset="100%" stop-color="#0a0305" />
    </linearGradient>
    <radialGradient id="strGlow" cx="65%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(225, 29, 72, 0.25)" />
      <stop offset="60%" stop-color="rgba(190, 18, 60, 0.08)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <rect width="700" height="200" fill="url(#strBg)" />
  <rect width="700" height="200" fill="url(#strGlow)" />

  <!-- Stylized Cello / Violin F-Holes -->
  <g transform="translate(540, 100) scale(1.2)" stroke="#e11d48" stroke-width="2.5" fill="none" opacity="0.45">
    <path d="M -30,-40 C -15,-30 -10,-10 -25,0 C -40,10 -35,30 -20,40" />
    <circle cx="-30" cy="-40" r="3" fill="#e11d48" />
    <circle cx="-20" cy="40" r="3" fill="#e11d48" />

    <path d="M 30,-40 C 15,-30 10,-10 25,0 C 40,10 35,30 20,40" />
    <circle cx="30" cy="-40" r="3" fill="#e11d48" />
    <circle cx="20" cy="40" r="3" fill="#e11d48" />
  </g>

  <!-- Bow Wave Lines -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2">
    <path d="M 280,75 C 380,60 480,90 680,70" fill="none" />
    <path d="M 280,90 C 380,75 480,105 680,85" fill="none" stroke="rgba(225, 29, 72, 0.3)" />
    <path d="M 280,105 C 380,90 480,120 680,100" fill="none" />
    <path d="M 280,120 C 380,105 480,135 680,115" fill="none" stroke="rgba(225, 29, 72, 0.3)" />
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#fb7185">CHAMBER STRINGS</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Symphonic Violins & Cellos</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Vienna Philharmonic Hall • Legato & Staccato Articulations</text>
  </g>

  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(225, 29, 72, 0.12)" stroke="#e11d48" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#fb7185">STRINGS</text>
  </g>
</svg>
