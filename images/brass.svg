<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="brassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f06" />
      <stop offset="50%" stop-color="#2a1e08" />
      <stop offset="100%" stop-color="#100b03" />
    </linearGradient>
    <radialGradient id="brassGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.35)" />
      <stop offset="60%" stop-color="rgba(202, 138, 4, 0.1)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    <linearGradient id="goldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="700" height="200" fill="url(#brassBg)" />
  <rect width="700" height="200" fill="url(#brassGlow)" />

  <!-- Horn Bell Flare on Right -->
  <g transform="translate(560, 100)" opacity="0.7">
    <ellipse cx="60" cy="0" rx="35" ry="75" fill="url(#goldHorn)" stroke="#ca8a04" stroke-width="2" />
    <ellipse cx="60" cy="0" rx="28" ry="65" fill="#1c1305" />
    <path d="M -60,-15 C -20,-15 10,-30 60,-75 L 60,75 C 10,30 -20,15 -60,15 Z" fill="url(#goldHorn)" />
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#eab308">HOLLYWOOD BRASS</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Cinematic Horns & Trumpets</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Abbey Road Recording • Majestic Fanfares & Swells</text>
  </g>

  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(234, 179, 8, 0.12)" stroke="#eab308" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#eab308">BRASS</text>
  </g>
</svg>
