<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080314" />
      <stop offset="50%" stop-color="#19092c" />
      <stop offset="100%" stop-color="#070211" />
    </linearGradient>
    <radialGradient id="bellGlow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.35)" />
      <stop offset="40%" stop-color="rgba(217, 70, 239, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="200" fill="url(#bellBg)" />
  <rect width="700" height="200" fill="url(#bellGlow)" />

  <!-- Crystalline Geometry & Shimmer particles -->
  <g transform="translate(490, 100)" stroke="url(#crystalGrad)" stroke-width="1.5" fill="none" opacity="0.75">
    <polygon points="0,-70 55,-25 55,45 0,70 -55,45 -55,-25" />
    <polygon points="0,-50 40,-15 40,30 0,50 -40,30 -40,-15" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="0" y1="-70" x2="0" y2="70" />
    <line x1="-55" y1="-25" x2="55" y2="45" />
    <line x1="-55" y1="45" x2="55" y2="-25" />
  </g>

  <!-- Sound Shimmer Rays -->
  <g stroke="rgba(251, 113, 133, 0.25)" stroke-width="1" stroke-dasharray="3,3">
    <line x1="490" y1="100" x2="330" y2="50" />
    <line x1="490" y1="100" x2="350" y2="150" />
    <line x1="490" y1="100" x2="650" y2="40" />
    <line x1="490" y1="100" x2="660" y2="160" />
  </g>

  <!-- Sparkle stars -->
  <g fill="#ffffff" opacity="0.9">
    <polygon points="410,60 412,65 417,67 412,69 410,74 408,69 403,67 408,65" />
    <polygon points="580,50 581,54 585,55 581,56 580,60 579,56 575,55 579,54" />
    <polygon points="560,150 562,154 566,155 562,156 560,160 558,156 554,155 558,154" />
    <polygon points="350,120 351,123 354,124 351,125 350,128 349,125 346,124 349,123" />
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#f43f5e">FM METALLOPHONE</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Celestial Crystal Bell</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Astral Glassworks • Crystalline Harmonics & Shimmer</text>
  </g>

  <!-- Tag -->
  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#f43f5e">FM BELL</text>
  </g>
</svg>
