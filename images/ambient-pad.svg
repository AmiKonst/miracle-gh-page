<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="padBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0c1028" />
      <stop offset="100%" stop-color="#04060e" />
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.35)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="200" fill="url(#padBg)" />
  <rect width="700" height="200" fill="url(#nebulaGlow)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="700" y2="40" />
    <line x1="0" y1="80" x2="700" y2="80" />
    <line x1="0" y1="120" x2="700" y2="120" />
    <line x1="0" y1="160" x2="700" y2="160" />
    <line x1="100" y1="0" x2="100" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="300" y1="0" x2="300" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="500" y1="0" x2="500" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
  </g>

  <!-- Oscilloscope Sine / Complex Waves -->
  <path d="M 280,100 Q 330,40 380,100 T 480,100 T 580,100 T 680,100" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.8" />
  <path d="M 280,100 Q 320,150 370,100 T 470,100 T 570,100 T 670,100" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
  <path d="M 300,100 Q 360,20 420,100 T 540,100 T 660,100" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.35" />

  <!-- LFO Points -->
  <circle cx="380" cy="100" r="4" fill="#38bdf8" />
  <circle cx="480" cy="100" r="4" fill="#818cf8" />
  <circle cx="580" cy="100" r="4" fill="#c084fc" />

  <!-- Synth Panel Encoders on Right -->
  <g transform="translate(580, 150)" opacity="0.6">
    <!-- Knob 1 -->
    <circle cx="-60" cy="0" r="16" fill="#14192b" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-60" y1="0" x2="-60" y2="-10" stroke="#38bdf8" stroke-width="2" />
    <text x="-60" y="24" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#818cf8">CUTOFF</text>
    <!-- Knob 2 -->
    <circle cx="0" cy="0" r="16" fill="#14192b" stroke="#818cf8" stroke-width="1.5" />
    <line x1="0" y1="0" x2="7" y2="-8" stroke="#818cf8" stroke-width="2" />
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#818cf8">RESONANCE</text>
    <!-- Knob 3 -->
    <circle cx="60" cy="0" r="16" fill="#14192b" stroke="#c084fc" stroke-width="1.5" />
    <line x1="60" y1="0" x2="68" y2="2" stroke="#c084fc" stroke-width="2" />
    <text x="60" y="24" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c084fc">SPACE</text>
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#38bdf8">ANALOG ATMOSPHERES</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Deep Atmospheric Pad</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Etherwave Synthesis • Dual Filter Modulation</text>
  </g>

  <!-- Tag -->
  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#38bdf8">ANALOG</text>
  </g>
</svg>
