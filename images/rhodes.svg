<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#18151f" />
      <stop offset="100%" stop-color="#0c0910" />
    </linearGradient>
    <radialGradient id="rGlow" cx="65%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.3)" />
      <stop offset="60%" stop-color="rgba(168, 85, 247, 0.08)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <rect width="700" height="200" fill="url(#rBg)" />
  <rect width="700" height="200" fill="url(#rGlow)" />

  <!-- Silver grille & retro tines -->
  <g transform="translate(500, 100)" opacity="0.5">
    <rect x="-80" y="-40" width="200" height="80" rx="6" fill="#1e1b29" stroke="#a855f7" stroke-width="1.5" />
    <line x1="-80" y1="-20" x2="120" y2="-20" stroke="rgba(255,255,255,0.15)" />
    <line x1="-80" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.15)" />
    <line x1="-80" y1="20" x2="120" y2="20" stroke="rgba(255,255,255,0.15)" />
    <!-- Glowing jewel lamp -->
    <circle cx="90" cy="-20" r="6" fill="#ec4899" />
    <circle cx="90" cy="-20" r="12" fill="rgba(236, 72, 153, 0.4)" />
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#c084fc">SUITCASE 73 MARK I</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Vintage Electric Piano</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Classic Tine Bark & Stereo Tremolo • Neo-Soul Warmth</text>
  </g>

  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#c084fc">E-PIANO</text>
  </g>
</svg>
