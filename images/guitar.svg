<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c06" />
      <stop offset="50%" stop-color="#2a1608" />
      <stop offset="100%" stop-color="#0e0804" />
    </linearGradient>
    <radialGradient id="soundHole" cx="70%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#050302" />
      <stop offset="60%" stop-color="#140b05" />
      <stop offset="100%" stop-color="#3d210d" />
    </radialGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="700" height="200" fill="url(#gBg)" />
  
  <!-- Soundhole & Rosette on right -->
  <circle cx="530" cy="100" r="85" fill="url(#soundHole)" stroke="#854d0e" stroke-width="6" opacity="0.9" />
  <circle cx="530" cy="100" r="75" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  <circle cx="530" cy="100" r="65" fill="#040201" />

  <!-- Acoustic Strings -->
  <g stroke="url(#bronze)" opacity="0.8">
    <line x1="160" y1="70" x2="700" y2="70" stroke-width="2.6" />
    <line x1="160" y1="82" x2="700" y2="82" stroke-width="2.2" />
    <line x1="160" y1="94" x2="700" y2="94" stroke-width="1.8" />
    <line x1="160" y1="106" x2="700" y2="106" stroke-width="1.4" />
    <line x1="160" y1="118" x2="700" y2="118" stroke-width="1.1" />
    <line x1="160" y1="130" x2="700" y2="130" stroke-width="0.9" />
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#f59e0b">DREADNOUGHT ACOUSTIC</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Steel String Guitar</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Nashville Luthier Series • Handcrafted Sitka Spruce</text>
  </g>

  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#f59e0b">ACOUSTIC</text>
  </g>
</svg>
