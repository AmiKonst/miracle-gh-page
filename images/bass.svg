<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0d" />
      <stop offset="50%" stop-color="#0b1720" />
      <stop offset="100%" stop-color="#030608" />
    </linearGradient>
    <radialGradient id="subGlow" cx="65%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.3)" />
      <stop offset="60%" stop-color="rgba(6, 182, 212, 0.05)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <rect width="700" height="200" fill="url(#bassBg)" />
  <rect width="700" height="200" fill="url(#subGlow)" />

  <!-- Heavy Bass Strings -->
  <g stroke="#94a3b8">
    <line x1="160" y1="75" x2="700" y2="75" stroke-width="5" opacity="0.9" />
    <line x1="160" y1="95" x2="700" y2="95" stroke-width="4" opacity="0.85" />
    <line x1="160" y1="115" x2="700" y2="115" stroke-width="3" opacity="0.8" />
    <line x1="160" y1="135" x2="700" y2="135" stroke-width="2.2" opacity="0.75" />
  </g>

  <!-- Pickups on right -->
  <g transform="translate(540, 105)" opacity="0.65">
    <rect x="-35" y="-45" width="70" height="35" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="-15" cy="-28" r="5" fill="#e2e8f0" />
    <circle cx="15" cy="-28" r="5" fill="#e2e8f0" />
    <rect x="-35" y="10" width="70" height="35" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="-15" cy="28" r="5" fill="#e2e8f0" />
    <circle cx="15" cy="28" r="5" fill="#e2e8f0" />
  </g>

  <!-- Title Badge & Typography Motif -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#06b6d4">CUSTOM SHOP '62</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Vintage Precision Bass</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.5)">Deep Warm Low-End • Tube Preamp DI & Mic Blend</text>
  </g>

  <g transform="translate(610, 40)">
    <rect x="-30" y="-12" width="90" height="24" rx="4" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1" />
    <text x="15" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#06b6d4">BASS</text>
  </g>
</svg>
